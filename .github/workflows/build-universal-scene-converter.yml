name: Build Universal Scene Converter

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/build-universal-scene-converter.yml"
      - "CMakeLists.txt"
      - "JSON_OUTPUT.md"
      - "LICENSE"
      - "schemas/**"
      - "src/**"
      - "scripts/ci/**"
      - "tests/**"
      - "licenses/**"

permissions:
  contents: write

concurrency:
  group: universal-scene-converter-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENUSD_REF: "v25.11"
  ADOBE_REF: "2026.07"
  FBX_SDK_VERSION: "2020.3.9"
  BUILD_JOBS: "4"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable MSVC x64 environment
        shell: pwsh
        run: ./scripts/ci/Enable-Msvc.ps1

      - name: Print toolchain versions
        shell: pwsh
        run: |
          git --version
          cmake --version
          cl 2>&1 | Select-Object -First 2

      - name: Restore combined native SDK cache
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/work/usd-install
          key: native-${{ runner.os }}-x64-${{ env.OPENUSD_REF }}-${{ env.ADOBE_REF }}-fbx-${{ env.FBX_SDK_VERSION }}-${{ hashFiles('scripts/ci/Common.ps1', 'scripts/ci/Build-OpenUsd.ps1', 'scripts/ci/Get-FbxSdk.ps1', 'scripts/ci/Build-AdobePlugins.ps1', 'licenses/Autodesk-FBX-SDK-NOTICE.txt') }}

      - name: Restore OpenUSD base cache
        id: openusd-cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/work/usd-install
          key: openusd-${{ runner.os }}-x64-${{ env.OPENUSD_REF }}-${{ hashFiles('scripts/ci/Common.ps1', 'scripts/ci/Build-OpenUsd.ps1') }}
          restore-keys: |
            openusd-${{ runner.os }}-x64-${{ env.OPENUSD_REF }}-

      - name: Set up Python
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.openusd-cache.outputs.cache-matched-key == ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Clone pinned sources
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/ci/Get-Sources.ps1

      - name: Build minimal OpenUSD SDK
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.openusd-cache.outputs.cache-matched-key == ''
        shell: pwsh
        run: ./scripts/ci/Build-OpenUsd.ps1

      - name: Save deterministic OpenUSD cache
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.openusd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/work/usd-install
          key: openusd-${{ runner.os }}-x64-${{ env.OPENUSD_REF }}-${{ hashFiles('scripts/ci/Common.ps1', 'scripts/ci/Build-OpenUsd.ps1') }}

      - name: Set up Autodesk FBX SDK
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/ci/Get-FbxSdk.ps1

      - name: Build Adobe file-format plugins
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/ci/Build-AdobePlugins.ps1

      - name: Save combined native SDK cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/work/usd-install
          key: native-${{ runner.os }}-x64-${{ env.OPENUSD_REF }}-${{ env.ADOBE_REF }}-fbx-${{ env.FBX_SDK_VERSION }}-${{ hashFiles('scripts/ci/Common.ps1', 'scripts/ci/Build-OpenUsd.ps1', 'scripts/ci/Get-FbxSdk.ps1', 'scripts/ci/Build-AdobePlugins.ps1', 'licenses/Autodesk-FBX-SDK-NOTICE.txt') }}

      - name: Build focused usdconvert CLI
        shell: pwsh
        run: ./scripts/ci/Build-Converter.ps1

      - name: Report cache result
        shell: pwsh
        run: |
          if ("${{ steps.native-cache.outputs.cache-hit }}" -eq "true") {
              Write-Host "Combined native SDK cache hit: only usdconvert was rebuilt."
          } elseif ("${{ steps.openusd-cache.outputs.cache-matched-key }}" -ne "") {
              Write-Host "OpenUSD cache restored: Adobe plugins and usdconvert were rebuilt."
          } else {
              Write-Host "Cold build: OpenUSD, Adobe plugins, and usdconvert were built."
          }

      - name: Assemble portable runtime
        shell: pwsh
        run: ./scripts/ci/Package-Runtime.ps1

      - name: Test portable runtime
        shell: pwsh
        run: ./scripts/ci/Test-Runtime.ps1

      - name: Upload portable CLI
        uses: actions/upload-artifact@v7
        with:
          name: universal-scene-converter-windows-x64
          path: ${{ github.workspace }}/work/dist/universal-scene-converter-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "work/dist/universal-scene-converter-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $zipPath -PathType Leaf)) {
              throw "Release ZIP was not created: $zipPath"
          }

          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:GITHUB_REF_NAME $zipPath --clobber --repo $env:GITHUB_REPOSITORY
          } else {
              gh release create $env:GITHUB_REF_NAME $zipPath `
                  --verify-tag --generate-notes `
                  --title "Universal Scene Converter $env:GITHUB_REF_NAME" `
                  --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: universal-scene-converter-windows-x64-diagnostics
          path: |
            ${{ github.workspace }}/work/diagnostics
            ${{ github.workspace }}/work/smoke
          if-no-files-found: warn
          retention-days: 7
